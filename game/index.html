<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Isometric Hex Prototype</title>
    <style>
      /* Centre the game canvas within the viewport */
      body {
        margin: 0;
        background: #222;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="phaser-container"></div>
    <!-- Phaser core library -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.85.0/dist/phaser.js"></script>
    <!-- We deliberately omit the external isometric plugin because the
         execution environment cannot fetch it due to network
         restrictions.  Instead, the isometric projection logic is
         implemented directly within main.js.  If you wish to use
         phaser3-plugin-isometric in your own setup, you can reintroduce
         the script tag here. -->
    <!-- Main game code -->
    <script src="main.js"></script>
  </body>
</html>
