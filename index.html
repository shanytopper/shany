<!--
  index.html

  This file boots up a simple Babylon.js project.  It declares a full page canvas
  and loads the Babylon.js engine from the official CDN.  A module script
  (`main.js`) contains all of the application logic.  When the page loads the
  game class defined in `main.js` constructs the scene, loads free assets and
  starts the render loop.  The game is deliberately architected using small
  classes to follow the principles of Clean Code and SOLID – each class has
  a single responsibility and dependencies are explicitly passed via the
  constructor.
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Babylon.js – Third‑person Demo</title>
    <style>
      /* Remove margins so the canvas covers the entire window */
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        height: 100%;
        width: 100%;
      }
      #renderCanvas {
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
    <!-- Babylon.js core library.  When the user runs this on their own machine
         the script is downloaded from the official CDN.  Including it here
         avoids bundling Babylon.js into this repository. -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <!-- Loaders package adds support for formats such as glTF and .babylon.
         Without this the SceneLoader wouldn’t know how to parse the external
         assets we import. -->
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>
    <!-- Our application logic is placed in a separate module script.  Using
         type="module" allows us to break up the code into multiple files and
         use modern JavaScript syntax such as classes and async/await. -->
    <script type="module" src="./main.js"></script>
  </body>
</html>
